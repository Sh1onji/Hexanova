<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">

    <link rel="stylesheet" href="css/inquire.css">

    <title>Inquire | Hexanova Agency</title>
</head>

<body>

    <!-- Header -->
    <header class="About">
        <div>
            <img src="images/logo.png" alt="Hexanova Agency Logo" class="logo">
        </div>

        <div class="header-text">
            Hexanova Agency
        </div>

        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="index.html#nations">Nations</a>
            <span>Inquire</span>
        </nav>
    </header>

    <!-- Inquire Main Section -->
    <section class="inquire-section">
        <div class="inquire-card">
            <div class="form-header">
                <span class="subTitle">Teyvat Expeditions</span>
                <h2 class="Title">Send Us an Inquiry</h2>
                <p class="text">Have a question about our journeys across the nations? Leave your details below and our agents will get back to you.</p>
            </div>

            <form action="#" class="inquire-form">
                <div class="form-group">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="e.g. Lumine" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="traveler@adventurersguild.com" required>
                </div>

                <div class="form-group">
                    <label for="questions">Questions</label>
                    <textarea id="questions" name="questions" rows="5" placeholder="Ask us anything about destinations, packages, or travel plans..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Inquiry</button>
            </form>
        </div>

        <!-- Footer -->
        <footer>
            <div class="foot-left">
                <img src="images/HomepageIMG/Logo.png" alt="logo">
                <span>Teyvat Travel Agency</span>
            </div>

            <nav class="foot-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="Package.html">Nations</a>
                <a href="about.html">About</a>
                <a href="inquire.html" class="linkpage">Inquire</a>
            </nav>

            <nav class="foot-socials" aria-label="Social media">
                <a href="https://discord.com/">Discord</a>
                <a href="https://twitter.com/">Twitter</a>
                <a href="https://www.instagram.com/">Instagram</a>
                <a href="https://www.youtube.com/">YouTube</a>
            </nav>
        </footer>
    </section>
<script>
    const inquireForm = document.querySelector('.inquire-form');

    // Create a reusable error message element above the submit button
    const errorBox = document.createElement('p');
    errorBox.className = 'text';
    errorBox.style.color = '#f38ba8';
    errorBox.style.marginTop = '0.75rem';
    errorBox.style.display = 'none';
    inquireForm.appendChild(errorBox);

    inquireForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const name = document.getElementById('fullname').value.trim();
        const email = document.getElementById('email').value.trim();
        const questions = document.getElementById('questions').value.trim();

        // Simple custom validation rules
        if (name.length < 2) {
            errorBox.textContent = 'Please enter at least 2 characters for your name.';
            errorBox.style.display = 'block';
            return;
        }

        if (!email.includes('@') || !email.includes('.')) {
            errorBox.textContent = 'Please enter a valid email address.';
            errorBox.style.display = 'block';
            return;
        }

        if (questions.length < 10) {
            errorBox.textContent = 'Please enter a slightly longer question (at least 10 characters).';
            errorBox.style.display = 'block';
            return;
        }

        errorBox.style.display = 'none';

        const confirmation = document.createElement('p');
        confirmation.className = 'text';
        confirmation.style.marginTop = '1rem';
        confirmation.textContent = `Thanks, ${name}! Your inquiry has been recorded, and our agents will reach out to ${email}.`;

        inquireForm.reset();
        inquireForm.replaceWith(confirmation);
    });
</script>



</body>
</html>
